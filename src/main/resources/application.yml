spring:
  application:
    name: portfolio-api
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/portfolio}
      auto-index-creation: true
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false
  servlet:
    multipart:
      # As imagens vao para o GridFS; o limite real esta no FileStorageService.
      max-file-size: 5MB
      max-request-size: 6MB

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: always
  compression:
    enabled: true

portfolio:
  cors:
    # Origens autorizadas a falar com a API. Em producao, so o dominio do portfolio.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000}
  jwt:
    # HS256 exige no minimo 32 bytes. Em producao define JWT_SECRET.
    secret: ${JWT_SECRET:troca-este-segredo-em-producao-com-pelo-menos-32-bytes}
    issuer: manuelluvuvamo.com
    access-token-minutes: ${JWT_ACCESS_MINUTES:30}
    refresh-token-days: ${JWT_REFRESH_DAYS:14}
  admin:
    # Utilizador ADMIN criado no arranque se ainda nao existir.
    email: ${ADMIN_EMAIL}
    password: ${ADMIN_PASSWORD}
    name: ${ADMIN_NAME}
  seed:
    # Popula as coleccoes vazias a partir de classpath:seed/portfolio-seed.json
    enabled: ${SEED_ENABLED:true}

springdoc:
  swagger-ui:
    path: /docs
  api-docs:
    path: /v3/api-docs

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

logging:
  level:
    com.manuelluvuvamo.portfolio: INFO
